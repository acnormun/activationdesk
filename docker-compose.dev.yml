# Local stack: PostgreSQL + the Activation Desk API, which also serves the
# built frontend on the same origin (single service). For frontend hot-reload,
# run `npm run dev` in frontend/ instead — its Vite proxy forwards the API
# paths to :8000.
services:
  db:
    image: postgres:16-alpine
    container_name: activationdesk-db
    environment:
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
      POSTGRES_DB: activationdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activationdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: activationdesk-api
    environment:
      DATABASE_URL: postgresql+psycopg://activation:activation@db:5432/activationdesk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
