# Local stack: PostgreSQL, the Activation Desk API and the Vue SPA frontend.
services:
  db:
    image: postgres:16-alpine
    container_name: activationdesk-db
    environment:
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
      POSTGRES_DB: activationdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activationdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: activationdesk-api
    environment:
      DATABASE_URL: postgresql+psycopg://activation:activation@db:5432/activationdesk
      # Comma-separated origins the API accepts with cookies.
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: activationdesk-web
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
